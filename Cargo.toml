[workspace]
members = [".", "crates/hyprstate-fsm"]
default-members = [".", "crates/hyprstate-fsm"]
resolver = "3"

[package]
name = "hyprstate"
version = "2.12.1"
edition = "2024"
license = "MIT"
description = "Hyprland session/power state machine: lid, monitors, profiles, GPU selection, powerd"
repository = "https://github.com/MasonRhodesDev/hyprstate"
publish = false

[dependencies]
hyprstate-fsm = { path = "crates/hyprstate-fsm" }
xdg-paths = "0.2.0"
logind-session = "0.3.0"
hypr-ipc = "0.1.3"
inotify = "0.11.5"
monitor-profiles = { git = "https://github.com/MasonRhodesDev/monitor-profiles", rev = "e263f57", features = ["hyprland-render"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "6", default-features = false, features = ["tokio", "proxy", "service"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "net", "process", "io-util", "signal"] }
futures-util = { version = "0.3", default-features = false }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = "0.3"
span-lines = { git = "https://github.com/MasonRhodesDev/desktop-commons", rev = "266121a", features = ["tracing"] }
anyhow = "1"
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }

[profile.release]
lto = true
strip = true

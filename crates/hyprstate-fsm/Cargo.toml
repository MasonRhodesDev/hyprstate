[package]
name = "hyprstate-fsm"
version = "5.3.0"
edition = "2024"
license = "MIT"
description = "Pure, I/O-free state machine + policy layer for hyprstate (shared by the daemon and the GUI)."
repository = "https://github.com/MasonRhodesDev/hyprstate"
publish = false

[dependencies]
monitor-profiles = { git = "https://github.com/MasonRhodesDev/monitor-profiles", rev = "e263f57", features = ["hyprland-render"] }
serde = { version = "1", features = ["derive"] }
